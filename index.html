<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Dejla Smart Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root{--g:#6abf1e;--gd:#4e9012;--gl:#eef7e0;--gp:#f4fbec;--r:#e53935;--rl:#fdecea;--b:#f0f2ee;--t:#2a3020;--m:#7a8572;--b3:#e4e8e0;--b4:#c8cfc2;--nav:70px;--top:60px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:"Cairo",sans-serif;background:var(--b);color:var(--t);}
#splash{position:fixed;inset:0;background:linear-gradient(170deg,#f0fae0,#d4f0a8);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;text-align:center;padding:40px;}
#splash img{width:180px;height:180px;border-radius:40px;background:white;padding:16px;box-shadow:0 16px 50px rgba(78,144,18,0.3);animation:pulse 1.8s ease-in-out infinite;}
#splash h1{color:var(--gd);font-size:2rem;font-weight:900;margin-top:28px;}
#splash p{color:var(--m);font-size:.95rem;margin-top:6px;margin-bottom:36px;}
.dots{display:flex;gap:12px;justify-content:center;}
.dot{width:13px;height:13px;border-radius:50%;background:var(--gl);animation:dp 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:.25s;}.dot:nth-child(3){animation-delay:.5s;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
@keyframes dp{0%,100%{background:var(--gl);transform:scale(1);}50%{background:var(--gd);transform:scale(1.4);}}
#login{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(170deg,#f0fae0,#d4f0a8);padding:32px 24px;text-align:center;}
#login img{width:160px;height:160px;border-radius:36px;background:white;padding:14px;margin-bottom:20px;box-shadow:0 12px 40px rgba(78,144,18,0.22);}
#login h1{color:var(--gd);font-size:1.8rem;font-weight:900;margin-bottom:4px;}
#login p{color:var(--m);font-size:.95rem;margin-bottom:32px;}
.pr{display:flex;gap:14px;margin-bottom:28px;}
.pd{width:18px;height:18px;border-radius:50%;background:var(--b3);border:2px solid var(--b4);transition:all .2s;}
.pd.on{background:var(--g);border-color:var(--gd);transform:scale(1.15);}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(300px,82vw);}
.nb{background:white;border:none;border-radius:20px;color:var(--t);font-family:"Cairo",sans-serif;font-size:1.7rem;font-weight:700;padding:18px 10px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.1);transition:all .15s;}
.nb:active{background:var(--gl);transform:scale(.94);}
.nb.del{font-size:1.1rem;color:var(--m);}
.nb.em{background:transparent;box-shadow:none;pointer-events:none;}
.err{color:var(--r);font-size:.82rem;margin-top:10px;font-weight:700;opacity:0;transition:opacity .3s;}
.err.show{opacity:1;}
#app{display:none;flex-direction:column;height:100vh;}
.topbar{height:var(--top);background:white;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:2px solid var(--gl);box-shadow:0 2px 12px rgba(78,144,18,.08);flex-shrink:0;}
.topbar img{height:40px;border-radius:10px;}
.tc{flex:1;text-align:center;}
.tc h2{color:var(--gd);font-size:.95rem;font-weight:900;}
.tc small{color:var(--m);font-size:.7rem;}
.xb{background:var(--rl);color:var(--r);border:none;border-radius:10px;padding:7px 12px;font-family:"Cairo",sans-serif;font-size:.75rem;font-weight:700;cursor:pointer;}
.cnt{flex:1;overflow-y:auto;padding-bottom:calc(var(--nav) + 8px);}
.bnav{height:var(--nav);background:white;display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;border-top:1.5px solid var(--b3);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--b4);border-top:3px solid transparent;transition:all .2s;}
.ni.on{color:var(--gd);border-top-color:var(--g);background:var(--gp);}
.ni svg{width:26px;height:26px;transition:transform .2s;}
.ni.on svg{transform:translateY(-2px);}
.ni span{font-size:.63rem;font-weight:700;}
.sec{display:none;padding:14px;}
.sec.on{display:block;}
.stitle{font-size:1.05rem;font-weight:900;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.sc{background:white;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1.5px solid var(--b3);}
.sn{font-size:1.8rem;font-weight:900;color:var(--gd);line-height:1;}
.sl{font-size:.63rem;color:var(--m);margin-top:4px;font-weight:600;}
.card{background:white;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:12px;overflow:hidden;border:1.5px solid var(--b3);}
.ch{padding:12px 16px;border-bottom:1.5px solid var(--b3);display:flex;align-items:center;justify-content:space-between;background:var(--b);}
.ct{font-weight:900;font-size:.88rem;}
.rb{background:var(--gl);color:var(--gd);border:none;border-radius:10px;padding:7px 14px;font-family:"Cairo",sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;}
.li{padding:12px 16px;border-bottom:1px solid var(--b3);display:flex;align-items:center;gap:12px;}
.li:last-child{border-bottom:none;}
.av{width:42px;height:42px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:900;color:var(--gd);flex-shrink:0;}
.lb{flex:1;min-width:0;}
.ln{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ls{font-size:.72rem;color:var(--m);margin-top:2px;}
.lr{text-align:left;flex-shrink:0;}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700;}
.bg{background:var(--gl);color:var(--gd);}
.br2{background:var(--rl);color:var(--r);}
.fg{margin-bottom:14px;}
.fg label{display:block;font-size:.75rem;font-weight:700;color:var(--m);margin-bottom:5px;text-transform:uppercase;}
.fg input,.fg select{width:100%;padding:12px 14px;border:2px solid var(--b3);border-radius:12px;font-family:"Cairo",sans-serif;font-size:.95rem;color:var(--t);background:#fafafa;outline:none;transition:border-color .2s;}
.fg input:focus,.fg select:focus{border-color:var(--g);background:white;}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-family:"Cairo",sans-serif;font-size:.95rem;font-weight:900;cursor:pointer;margin-top:4px;transition:all .2s;}
.bng{background:linear-gradient(135deg,var(--g),var(--gd));color:white;box-shadow:0 4px 12px rgba(78,144,18,.3);}
.bno{background:white;border:2px solid var(--b3);color:var(--m);}
.empty{text-align:center;padding:24px 16px;color:var(--b4);}
.toast{position:fixed;bottom:calc(var(--nav) + 12px);left:12px;right:12px;background:#3d4438;color:white;border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:10px;transform:translateY(120px);transition:transform .35s cubic-bezier(.34,1.56,.64,1);z-index:999;}
.toast.show{transform:translateY(0);}
.sp{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-left:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<script>

function sw(n,el){document.querySelectorAll(".sec").forEach(function(s){s.classList.remove("on");});document.querySelectorAll(".ni").forEach(function(i){i.classList.remove("on");});document.getElementById("s"+n).classList.add("on");el.classList.add("on");if(n===1)loadE();if(n===3)loadA();}
function loadH(){document.getElementById("hl").innerHTML="<div class=\"empty\"><p style=\"color:#aaa;font-weight:700;\">&#1580;&#1575;&#1585;&#1610; &#1575;&#1604;&#1578;&#1581;&#1605;&#1610;&#1604;...</p></div>";fetch(URL+"?action=getAttendance").then(function(r){return r.json();}).then(function(data){var today=new Date().toLocaleDateString("en-CA");var recs=(data.records||[]).filter(function(r){return r.date===today;});var map={};recs.forEach(function(r){if(!map[r.name])map[r.name]={name:r.name,branch:r.branch,inn:"--",out:"--"};if(r.action==="حضور")map[r.name].inn=r.time.slice(0,5);if(r.action==="انصراف")map[r.name].out=r.time.slice(0,5);});var list=Object.values(map);var present=list.filter(function(e){return e.inn!=="--";}).length;document.getElementById("n0").textContent=present;document.getElementById("n1").textContent=list.length-present;document.getElementById("n2").textContent=list.length;if(!list.length){document.getElementById("hl").innerHTML="<div class=\"empty\"><p>&#1604;&#1575; &#1578;&#1608;&#1580;&#1583; &#1587;&#1580;&#1604;&#1575;&#1578; &#1575;&#1604;&#1610;&#1608;&#1605;</p></div>";return;}var html="";list.forEach(function(e){html+="<div class=\"li\"><div class=\"av\">"+e.name.charAt(0)+"</div><div class=\"lb\"><div class=\"ln\">"+e.name+"</div><div class=\"ls\">"+e.branch+"</div></div><div class=\"lr\"><div style=\"font-size:.78rem;color:#4e9012;font-weight:700;\">"+e.inn+"</div><div style=\"font-size:.78rem;color:#e53935;font-weight:700;\">"+e.out+"</div></div></div>";});document.getElementById("hl").innerHTML=html;}).catch(function(){document.getElementById("hl").innerHTML="<div class=\"empty\"><p>&#1578;&#1593;&#1584;&#1585; &#1575;&#1604;&#1578;&#1581;&#1605;&#1610;&#1604;</p></div>";});}
function loadE(){document.getElementById("el").innerHTML="<div class=\"empty\"><p>&#1580;&#1575;&#1585;&#1610;...</p></div>";fetch(URL+"?action=getEmployees").then(function(r){return r.json();}).then(function(data){var emps=(data.employees||[]).filter(function(e){return e.status==="نشط";});if(!emps.length){document.getElementById("el").innerHTML="<div class=\"empty\"><p>&#1604;&#1575; &#1610;&#1608;&#1580;&#1583; &#1605;&#1608;&#1592;&#1601;&#1610;&#1606;</p></div>";return;}var html="";emps.forEach(function(e){html+="<div class=\"li\"><div class=\"av\" style=\"font-size:.72rem;\">"+e.code+"</div><div class=\"lb\"><div class=\"ln\">"+e.name+"</div><div class=\"ls\">"+e.branch+" · "+e.shift+"</div></div><div class=\"lr\"><span class=\"badge bg\">نشط</span><div style=\"font-size:.7rem;color:#888;margin-top:3px;\">"+Number(e.salary||0).toLocaleString()+" ج.م</div></div></div>";});document.getElementById("el").innerHTML=html;}).catch(function(){document.getElementById("el").innerHTML="<div class=\"empty\"><p>&#1578;&#1593;&#1584;&#1585;</p></div>";});}
function saveEmp(){var name=document.getElementById("fn").value.trim();var nid=document.getElementById("fi").value.trim();var br=document.getElementById("fb").value;var sh=document.getElementById("fs").value;var sal=document.getElementById("fsal").value;var ph=document.getElementById("fph").value.trim();var st=document.getElementById("fst").value;if(!name){toast("⚠","أدخل الاسم");return;}if(!nid||nid.length!==14){toast("⚠","رقم البطاقة 14 رقم");return;}if(!br){toast("⚠","اختر الفرع");return;}if(!sh){toast("⚠","اختر الشيفت");return;}var btn=document.getElementById("sb");btn.disabled=true;btn.innerHTML="جاري... <span class='sp'></span>";fetch(URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"addEmployee",name:name,nationalId:nid,branch:br,shift:sh,salary:sal,phone:ph,status:st})}).then(function(){toast("✅","تم حفظ الموظف!");clrF();}).catch(function(){toast("❌","حدث خطأ");});btn.disabled=false;btn.textContent="حفظ الموظف";}
function clrF(){["fn","fi","fb","fs","fsal","fph"].forEach(function(id){document.getElementById(id).value="";});document.getElementById("fst").value="نشط";}
function loadA(){document.getElementById("al").innerHTML="<div class=\"empty\"><p>&#1580;&#1575;&#1585;&#1610;...</p></div>";fetch(URL+"?action=getAttendance").then(function(r){return r.json();}).then(function(data){var recs=(data.records||[]).slice(-50).reverse();if(!recs.length){document.getElementById("al").innerHTML="<div class=\"empty\"><p>&#1604;&#1575; &#1578;&#1608;&#1580;&#1583; &#1587;&#1580;&#1604;&#1575;&#1578;</p></div>";return;}var html="";recs.forEach(function(r){var isIn=r.action==="حضور";var bg=isIn?"#eef7e0":"#fdecea";var cl=isIn?"#4e9012":"#e53935";var ar=isIn?"&#9650;":"&#9660;";html+="<div class=\"li\"><div class=\"av\" style=\"background:"+bg+";color:"+cl+";font-size:1.1rem;\">"+ar+"</div><div class=\"lb\"><div class=\"ln\">"+r.name+"</div><div class=\"ls\">"+r.branch+"</div></div><div class=\"lr\"><span class=\"badge "+(isIn?"bg":"br2")+"\">"+r.action+"</span><div style=\"font-size:.68rem;color:#aaa;margin-top:3px;\">"+r.date+" "+r.time.slice(0,5)+"</div></div></div>";});document.getElementById("al").innerHTML=html;}).catch(function(){document.getElementById("al").innerHTML="<div class=\"empty\"><p>&#1578;&#1593;&#1584;&#1585;</p></div>";});}
